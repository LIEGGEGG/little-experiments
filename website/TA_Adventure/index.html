<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TA Adventure</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#ffd700;font-family:system-ui,-apple-system,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;letter-spacing:.08em}
  </style>
</head>
<body>
  <div class="loading">TA Adventure · Loading…</div>
  <script>
    (async()=>{
      const source='./TA_Adventure_Public_FullBook_v18_MultiEnding.html';
      try{
        const res=await fetch(source,{cache:'no-cache'});
        if(!res.ok)throw new Error('HTTP '+res.status);
        let html=await res.text();
        html=html.replace('</head>','<link rel="stylesheet" href="./mobile-fix-v19.css?v=2"></head>');
        const mobileFixScript='<script src="./mobile-fix-v19.js?v=2"></'+'script>';
        html=html.replace('</body>',mobileFixScript+'</body>');
        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.body.innerHTML='<p style="padding:24px">加载失败。<a style="color:#00d9ff" href="'+source+'">打开 TA Adventure</a></p>';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
